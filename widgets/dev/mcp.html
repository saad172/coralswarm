<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoralSwarm MCP Apps protocol preview</title>
    <style>
      body { margin: 24px; background: #f7f8fa; color: #14161a; font: 14px system-ui; }
      form { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; margin-bottom: 24px; }
      label { display: grid; gap: 4px; } select, input, button { padding: 7px; font: inherit; }
      iframe { border: 0; width: 700px; max-width: 100%; height: 900px; display: block; }
      pre { max-height: 220px; overflow: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>MCP Apps protocol preview</h1>
    <p>Local preview · sample data. Built production HTML in an opaque sandbox, using standard MCP Apps messages.</p>
    <form id="controls">
      <label>Widget<select id="template"><option>ask_ocean</option><option>search_atoms</option><option>get_reef</option><option>recent_activity</option><option>result-card-v1</option></select></label>
      <label>Fixture<select id="fixture"></select></label>
      <label>Theme<select id="theme"><option>light</option><option>dark</option></select></label>
      <label>Display mode<select id="displayMode"><option>inline</option><option>fullscreen</option><option>pip</option></select></label>
      <label>Width<input id="width" type="number" min="320" max="1400" value="700" /></label>
      <label>Width preset<select id="widthPreset"><option value="">custom</option><option value="390">390 · phone</option><option value="430">430 · large phone</option><option value="768">768 · ChatGPT inline</option><option value="1024">1024 · tablet</option><option value="1280">1280 · desktop</option></select></label>
      <label>Reported host height<input id="height" type="number" min="1" placeholder="Automatic" /></label>
      <label>Reported max height<input id="maxHeight" type="number" min="1" placeholder="Uncapped" /></label>
      <label>Platform<select id="platform"><option>web</option><option>desktop</option><option>mobile</option></select></label>
      <label>Touch<input id="touch" type="checkbox" /></label>
      <label>Hover<input id="hover" type="checkbox" checked /></label>
      <label>Safe area bottom<input id="safeAreaBottom" type="number" min="0" max="80" value="0" /></label>
      <button type="button" id="send-result">Send tool result</button>
      <button type="button" id="cancel">Cancel tool</button>
      <button type="button" id="reload">Reload widget</button>
    </form>
    <iframe id="widget" title="CoralSwarm widget" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
    <h2>Protocol messages</h2>
    <p id="size-events">Size notifications: 0</p>
    <pre id="messages" aria-live="polite"></pre>
    <script type="module" src="./mcp.ts"></script>
  </body>
</html>
