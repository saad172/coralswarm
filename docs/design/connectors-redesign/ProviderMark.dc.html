</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:60},&quot;provider&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;slack&quot;,&quot;microsoft&quot;,&quot;google&quot;,&quot;gmail&quot;,&quot;github&quot;,&quot;jira&quot;,&quot;linear&quot;,&quot;confluence&quot;,&quot;hubspot&quot;,&quot;zendesk&quot;,&quot;dart&quot;],&quot;default&quot;:&quot;slack&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;letter&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;S&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hue&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;coral&quot;,&quot;pink&quot;,&quot;amber&quot;,&quot;teal&quot;,&quot;plum&quot;],&quot;default&quot;:&quot;amber&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;box&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:38,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  static IMG = {
    jira: "https://cdn.simpleicons.org/jira/0052CC",
    confluence: "https://cdn.simpleicons.org/confluence/172B4D",
    linear: "https://cdn.simpleicons.org/linear/5E6AD2",
    hubspot: "https://cdn.simpleicons.org/hubspot/FF7A59",
    zendesk: "https://cdn.simpleicons.org/zendesk/03363D",
    dart: "https://www.google.com/s2/favicons?domain=itsdart.com&sz=64",
  };
  renderVals() {
    const p = this.props.provider ?? "slack";
    const box = this.props.box ?? 38;
    const inline = ["slack", "microsoft", "gmail", "google", "github"].includes(p);
    const img = Component.IMG[p];
    const brand = inline || !!img;
    const hue = `var(--hue-${this.props.hue ?? "coral"})`;
    return {
      box, icon: Math.round(box * 0.58), letterSize: Math.round(box * (String(this.props.letter || "").length > 1 ? 0.42 : 0.55)),
      isSlack: p === "slack", isMicrosoft: p === "microsoft", isGmail: p === "gmail", isGoogle: p === "google", isGithub: p === "github",
      isImg: !inline && !!img, imgSrc: img || "", isLetter: !brand,
      letter: this.props.letter ?? "?",
      border: brand ? "1px solid var(--line)" : "1px solid transparent",
      bg: brand ? "var(--bg)" : `color-mix(in srgb, ${hue} 18%, transparent)`,
      fg: brand ? "var(--ink)" : hue,
    };
  }
}
</script>
</body>
</html>
