<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CoralSwarm — Prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* =========================================
     CoralSwarm — Design tokens (from handoff)
     ========================================= */
  :root {
    --bg:        #FBF7F2;
    --bg-2:      #F2EBE0;
    --bg-3:      #E8DCC8;
    --ink:       #1A1410;
    --ink-2:     #4A3F36;
    --ink-3:     #8A7B6E;
    --line:      #D9CCB8;

    --brand:     #F77764;
    --brand-2:   #D14A38;
    --brand-3:   #FFB89D;
    --accent:    #2A9D8F;

    --hue-coral: #F77764;
    --hue-pink:  #EB7290;
    --hue-amber: #F4B860;
    --hue-teal:  #2A9D8F;
    --hue-plum:  #7C5295;

    --ok:        #3F8A5B;
    --warn:      #D89A3A;
    --bad:       #C24A3A;

    --display: "Instrument Serif", "Times New Roman", serif;
    --sans:    "Geist", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono:    "JetBrains Mono", ui-monospace, monospace;

    --s-0: 2px;  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;
    --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;
    --s-8: 64px; --s-9: 96px; --s-10: 128px;

    --r-1: 4px; --r-2: 8px; --r-3: 12px; --r-4: 16px; --r-5: 24px; --r-full: 999px;

    --shadow-1: 0 1px 0 rgba(26,20,16,0.04), 0 1px 2px rgba(26,20,16,0.06);
    --shadow-2: 0 4px 16px -4px rgba(26,20,16,0.10), 0 2px 4px rgba(26,20,16,0.04);
    --shadow-3: 0 24px 48px -16px rgba(26,20,16,0.18), 0 8px 16px -8px rgba(26,20,16,0.10);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
  }

  ::selection { background: var(--brand); color: var(--bg); }

  .label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .mono { font-family: var(--mono); }
  .ink-3 { color: var(--ink-3); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: var(--s-2);
    padding: 4px 10px;
    border-radius: var(--r-full);
    background: var(--bg-2);
    border: 1px solid var(--line);
    font-size: 12px;
    font-family: var(--mono);
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }

  .cs-input {
    font-family: var(--sans);
    font-size: 14px;
    width: 100%;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-2);
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .cs-input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
  }

  button { font-family: var(--sans); border: none; cursor: pointer; }
  button:hover { filter: brightness(0.96); }
  input { font-family: var(--sans); }

  /* Reef texture (subtle dot grid) — used as ambient bg in places */
  .reef-bg {
    background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size: 24px 24px;
  }

  /* Screen container — each screen sits in here */
  .screen {
    min-height: 100vh;
    padding: var(--s-6) var(--s-7) 110px;
  }
  .container {
    max-width: 1240px;
    margin: 0 auto;
  }

  /* App chrome — used inside product screens */
  .chrome {
    border: 1px solid var(--line);
    border-radius: var(--r-4);
    background: var(--bg);
    box-shadow: var(--shadow-3);
    overflow: hidden;
  }

  .chrome-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }

  /* Bottom screen picker — the only chrome that's NOT part of the design itself */
  .picker {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    background: var(--ink);
    border-radius: 999px;
    box-shadow: 0 20px 40px -10px rgba(26,20,16,0.35), 0 8px 16px -8px rgba(26,20,16,0.2);
  }
  .picker button {
    background: transparent;
    color: rgba(255,255,255,0.55);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-family: var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .picker button:hover { color: rgba(255,255,255,0.85); }
  .picker button.active {
    background: var(--brand);
    color: white;
  }
  .picker .picker-num {
    font-size: 9px;
    opacity: 0.55;
    margin-right: 6px;
  }
  .picker button.active .picker-num { opacity: 0.7; }

  /* Connector card animations */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  .cursor::after {
    content: "▍";
    color: var(--brand);
    margin-left: 1px;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes streamIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stream-line {
    animation: streamIn 0.35s ease-out both;
  }

  /* Citation chip */
  .cite {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    margin: 0 2px;
    border-radius: 4px;
    background: var(--brand-3);
    color: var(--brand-2);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    vertical-align: 1px;
  }
  .cite:hover, .cite.hot {
    background: var(--brand);
    color: white;
  }
  .source-row.hot {
    border-color: var(--brand);
    background: color-mix(in srgb, var(--brand-3) 50%, var(--bg));
  }

  /* Connector tile states */
  .tile {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-3);
    padding: var(--s-5);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: var(--s-3);
    position: relative;
  }
  .tile:hover {
    border-color: var(--ink-3);
    box-shadow: var(--shadow-1);
  }
  .tile.connected {
    border-color: var(--ok);
    background: color-mix(in srgb, var(--ok) 4%, var(--bg));
  }
  .tile.connected .tile-status { color: var(--ok); }
  .tile-status {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* =========================================================
   DotMandala — the swarm mark (from logos.jsx, verbatim)
   ========================================================= */
const HUES = ["coral", "pink", "amber", "teal", "plum"];
const hueVar = (h) => `var(--hue-${h})`;

function DotMandala({ size = 80, mono = false, color = "currentColor", density = 1, rotate = 0 }) {
  const rings = [
    { r: 0.00, n: 1,  size: 0.085 },
    { r: 0.14, n: 6,  size: 0.060 },
    { r: 0.25, n: 10, size: 0.050 },
    { r: 0.35, n: 14, size: 0.042 },
    { r: 0.45, n: 18, size: 0.034 },
  ];
  const dots = [];
  let k = 0;
  rings.forEach((ring, ri) => {
    const n = Math.max(1, Math.round(ring.n * density));
    for (let i = 0; i < n; i++) {
      const a = ri === 0 ? 0 : (i / n) * Math.PI * 2 + ri * 0.4 + (rotate * Math.PI / 180);
      const x = 0.5 + Math.cos(a) * ring.r;
      const y = 0.5 + Math.sin(a) * ring.r;
      const fill = mono ? color : hueVar(HUES[(i + ri) % HUES.length]);
      dots.push(<circle key={k++} cx={x * size} cy={y * size} r={ring.size * size} fill={fill}/>);
    }
  });
  return <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{ display: "block" }}>{dots}</svg>;
}

function Wordmark({ size = 28, mono = false, color = "currentColor" }) {
  const dotSize = size * 0.78;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center",
      fontFamily: "var(--sans)", fontWeight: 600,
      fontSize: size, lineHeight: 1,
      letterSpacing: "-0.045em", color, whiteSpace: "nowrap",
    }}>
      <span>coral</span>
      <span style={{ display: "inline-flex", width: dotSize, height: dotSize, margin: `0 ${size * 0.04}px` }}>
        <DotMandala size={dotSize} mono={mono} color={color} density={mono ? 0.6 : 0.75}/>
      </span>
      <span>swarm</span>
    </span>
  );
}

/* =========================================================
   Shared primitives
   ========================================================= */
function Btn({ children, variant = "primary", size = "md", onClick, style, disabled }) {
  const base = {
    fontFamily: "var(--sans)", fontWeight: 500,
    border: "1px solid transparent", borderRadius: "var(--r-2)",
    cursor: disabled ? "not-allowed" : "pointer",
    transition: "all 0.15s",
    display: "inline-flex", alignItems: "center", gap: 8,
    opacity: disabled ? 0.5 : 1,
  };
  const sizes = {
    sm: { padding: "6px 12px", fontSize: 13 },
    md: { padding: "9px 16px", fontSize: 14 },
    lg: { padding: "12px 22px", fontSize: 15 },
  };
  const variants = {
    primary:   { background: "var(--brand)", color: "white", boxShadow: "var(--shadow-1)" },
    secondary: { background: "var(--bg)", color: "var(--ink)", borderColor: "var(--line)" },
    ghost:     { background: "transparent", color: "var(--ink-2)" },
    danger:    { background: "transparent", color: "var(--bad)", borderColor: "var(--bad)" },
  };
  return (
    <button onClick={onClick} disabled={disabled} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>
      {children}
    </button>
  );
}

function Badge({ children, tone = "brand", outline = false, style }) {
  const fills = {
    brand:  ["var(--brand)",  "white"],
    accent: ["var(--accent)", "white"],
    ok:     ["var(--ok)",     "white"],
    warn:   ["var(--warn)",   "white"],
    bad:    ["var(--bad)",    "white"],
    ink:    ["var(--ink)",    "var(--bg)"],
    plum:   ["var(--hue-plum)", "white"],
    amber:  ["var(--hue-amber)", "var(--ink)"],
    teal:   ["var(--hue-teal)", "white"],
  };
  const [bg, fg] = fills[tone] || fills.brand;
  if (outline) {
    return (
      <span style={{
        display: "inline-flex", padding: "3px 10px", fontSize: 12,
        border: `1px solid ${bg}`, color: bg, borderRadius: 999,
        fontFamily: "var(--mono)", letterSpacing: "0.02em",
        ...style,
      }}>{children}</span>
    );
  }
  return (
    <span style={{
      display: "inline-flex", padding: "3px 10px", fontSize: 12,
      background: bg, color: fg, borderRadius: 999, fontWeight: 500,
      ...style,
    }}>{children}</span>
  );
}

function Chip({ children, hue }) {
  const bg = hue ? `color-mix(in srgb, var(--hue-${hue}) 18%, transparent)` : "var(--brand-3)";
  const fg = hue ? `var(--hue-${hue})` : "var(--brand-2)";
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 4,
      padding: "2px 8px", fontSize: 12,
      background: bg, color: fg,
      borderRadius: "var(--r-full)",
      fontFamily: "var(--mono)", letterSpacing: "0.02em",
    }}>{children}</span>
  );
}

/* Small icons — borrowed from parts.jsx icon system */
const Icon = {
  search: (s = 14) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="6"/><path d="M16 16 L20 20"/></svg>,
  atom:  (s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="6" r="1"/><circle cx="18" cy="12" r="1"/><circle cx="12" cy="18" r="1"/><circle cx="6"  cy="12" r="1"/></svg>,
  thread:(s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12 C 8 4, 16 20, 20 12"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="20" cy="12" r="1.2" fill="currentColor"/></svg>,
  decision:(s = 18)=> <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3 L19 8 L19 16 L12 21 L5 16 L5 8 Z"/><path d="M9 12 L11 14 L15 10"/></svg>,
  entity:(s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="9" r="3"/><path d="M5 20 C 5 16, 8 14, 12 14 C 16 14, 19 16, 19 20"/></svg>,
  promote:(s = 18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 11 L16 7 M8 13 L16 17"/></svg>,
  provenance:(s=18)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7 V12 L15 14"/></svg>,
  arrowR: (s = 14) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg>,
  check:  (s = 14) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12 L10 17 L19 7"/></svg>,
};

/* Avatar — initial in a coloured circle */
function Avatar({ name, size = 22, hue }) {
  const h = hue || HUES[name.charCodeAt(0) % HUES.length];
  return (
    <div style={{
      width: size, height: size, borderRadius: 999,
      background: `color-mix(in srgb, var(--hue-${h}) 22%, var(--bg))`,
      color: `var(--hue-${h})`,
      display: "inline-flex", alignItems: "center", justifyContent: "center",
      fontSize: size * 0.42, fontWeight: 600,
      border: `1px solid color-mix(in srgb, var(--hue-${h}) 40%, transparent)`,
      flexShrink: 0,
    }}>{name[0].toUpperCase()}</div>
  );
}

/* Section header — same pattern as the design system */
function SecHead({ num, title, lead, italicWord }) {
  // Split title around italicWord
  let pre = title, ital = "", post = "";
  if (italicWord && title.includes(italicWord)) {
    const i = title.indexOf(italicWord);
    pre = title.slice(0, i);
    ital = italicWord;
    post = title.slice(i + italicWord.length);
  }
  return (
    <div style={{
      display: "grid", gridTemplateColumns: "200px 1fr",
      gap: "var(--s-7)", marginBottom: "var(--s-7)", alignItems: "baseline",
    }}>
      <div className="mono" style={{
        fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase",
        color: "var(--ink-3)", paddingTop: "var(--s-2)",
      }}>{num}</div>
      <div>
        <h2 style={{
          fontFamily: "var(--display)", fontWeight: 400,
          fontSize: "clamp(36px, 4vw, 52px)", lineHeight: 1.02,
          margin: "0 0 var(--s-3) 0", letterSpacing: "-0.01em",
        }}>
          {pre}<em style={{ fontStyle: "italic", color: "var(--brand)" }}>{ital}</em>{post}
        </h2>
        {lead && <p style={{
          fontSize: 16, lineHeight: 1.55, color: "var(--ink-2)",
          maxWidth: "60ch", margin: 0,
        }}>{lead}</p>}
      </div>
    </div>
  );
}


/* =========================================================
   SCREEN 1 — ONBOARDING / CONNECT SOURCES
   ========================================================= */
function OnboardScreen({ onAdvance }) {
  const [connectors, setConnectors] = useState({
    slack: false, gmail: false, zoom: false, calendar: false,
    outlook: false, notion: false, linear: false, mcp: false,
  });

  const toggle = (k) => setConnectors(c => ({ ...c, [k]: !c[k] }));
  const connectedCount = Object.values(connectors).filter(Boolean).length;

  const tiles = [
    { id: "slack", name: "Slack", desc: "Channel-level bot. Ingests from invite-time forward.", hue: "amber", letter: "S" },
    { id: "gmail", name: "Gmail", desc: "Add-on. Ingest a thread, watch for replies.", hue: "coral", letter: "G" },
    { id: "zoom",  name: "Zoom",  desc: "Marketplace app. Pulls transcripts from meetings you ingest.", hue: "teal", letter: "Z" },
    { id: "calendar", name: "Google Calendar", desc: "Used for co-presence matching only — no event content.", hue: "plum", letter: "C" },
    { id: "outlook", name: "Outlook", desc: "Office 365 add-in. Same model as Gmail.", hue: "pink", letter: "O" },
    { id: "notion", name: "Notion", desc: "Page-level. Pick what to ingest; future edits flow in.", hue: "amber", letter: "N" },
    { id: "linear", name: "Linear", desc: "Issue and project comments. Optional.", hue: "teal", letter: "L" },
    { id: "mcp",    name: "Claude Code · MCP", desc: "Auto-dump session context on Stop hooks.", hue: "coral", letter: "✦" },
  ];

  return (
    <div className="screen">
      <div className="container">
        {/* Top meta strip */}
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center",
          marginBottom: "var(--s-8)",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: "var(--s-3)" }}>
            <Wordmark size={22} />
            <span style={{ color: "var(--ink-3)" }}>/</span>
            <span className="mono" style={{ fontSize: 12, color: "var(--ink-3)" }}>onboarding · step 2 of 3</span>
          </div>
          <div style={{ display: "flex", gap: "var(--s-2)" }}>
            <Btn variant="ghost" size="sm">Skip for now</Btn>
            <Btn variant="primary" size="sm" onClick={() => onAdvance("home")} disabled={connectedCount === 0}>
              {connectedCount === 0 ? "Connect at least one source" : `Continue with ${connectedCount} ${connectedCount === 1 ? "source" : "sources"}`} {Icon.arrowR(13)}
            </Btn>
          </div>
        </div>

        <SecHead
          num="02 / connect"
          title="Bring in what you already do."
          italicWord="already do"
          lead="CoralSwarm doesn't sit on top of your work — it sits adjacent. Pick the sources you'd like the reef to grow from. You can change this any time. Nothing is captured silently: every connector surfaces a visible signal where the content lives."
        />

        {/* Manifest panel — echoes the hero in the design system */}
        <div style={{
          display: "grid", gridTemplateColumns: "1.3fr 0.7fr",
          gap: "var(--s-6)", marginBottom: "var(--s-7)",
        }}>
          {/* Connector grid */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: "var(--s-3)" }}>
            {tiles.map(t => (
              <div key={t.id}
                className={`tile${connectors[t.id] ? " connected" : ""}`}
                onClick={() => toggle(t.id)}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start" }}>
                  <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                    <div style={{
                      width: 38, height: 38, borderRadius: "var(--r-2)",
                      background: `color-mix(in srgb, var(--hue-${t.hue}) 18%, transparent)`,
                      color: `var(--hue-${t.hue})`,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontFamily: "var(--display)", fontStyle: "italic", fontSize: 22,
                    }}>{t.letter}</div>
                    <div>
                      <div style={{ fontSize: 15, fontWeight: 600 }}>{t.name}</div>
                      <div className="tile-status">
                        {connectors[t.id]
                          ? <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>{Icon.check(10)} connected</span>
                          : "not connected"}
                      </div>
                    </div>
                  </div>
                  <div style={{
                    width: 18, height: 18, borderRadius: 999,
                    border: `1.5px solid ${connectors[t.id] ? "var(--ok)" : "var(--line)"}`,
                    background: connectors[t.id] ? "var(--ok)" : "transparent",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    color: "white", flexShrink: 0,
                  }}>
                    {connectors[t.id] && Icon.check(10)}
                  </div>
                </div>
                <div style={{ fontSize: 13, color: "var(--ink-2)", lineHeight: 1.5 }}>{t.desc}</div>
              </div>
            ))}
          </div>

          {/* Manifest sidebar */}
          <div style={{

/* =========================================================
   SCREEN 3 — QUERY IN PROGRESS (typing → streaming → cites)
   ========================================================= */
function QueryScreen({ onAdvance }) {
  const [phase, setPhase] = useState("typing"); // typing → retrieving → streaming → done
  const [query, setQuery] = useState("");
  const [streamIdx, setStreamIdx] = useState(0);
  const [hotCite, setHotCite] = useState(null);

  const fullQuery = "what did we decide about auth for the migration?";

  // Typing animation
  useEffect(() => {
    if (phase !== "typing") return;
    if (query.length < fullQuery.length) {
      const t = setTimeout(() => setQuery(fullQuery.slice(0, query.length + 1)), 35 + Math.random() * 40);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setPhase("retrieving"), 350);
    return () => clearTimeout(t);
  }, [phase, query]);

  // Retrieval pause
  useEffect(() => {
    if (phase !== "retrieving") return;
    const t = setTimeout(() => setPhase("streaming"), 1100);
    return () => clearTimeout(t);
  }, [phase]);

  // Answer is composed of segments — some plain, some are citations
  const answerSegments = [
    { t: "Three months ago, in the migration kickoff thread, the team committed to ", c: null },
    { t: "OAuth 2.1 with PKCE", c: 1, hl: true },
    { t: " for first-party clients — Ari raised the option of going passwordless-only and ", c: null },
    { t: "Meera pushed back on the readiness of the WebAuthn vendor landscape", c: 2, hl: false },
    { t: ". The compromise was ", c: null },
    { t: "OAuth 2.1 as the primary path, with passkeys as an additive layer once the dependent libraries hit 1.0", c: 3, hl: true },
    { t: ".", c: null },
    { t: "\n\n", c: null },
    { t: "Two recent atoms suggest this may need a revisit: ", c: null },
    { t: "Jo flagged on Tuesday that the chosen library's roadmap dropped device-bound keys", c: 4, hl: false },
    { t: ", and ", c: null },
    { t: "a Slack thread last week reopened the passwordless conversation", c: 5, hl: false },
    { t: ". You haven't decided either way yet.", c: null },
  ];

  // Streaming animation
  useEffect(() => {
    if (phase !== "streaming") return;
    if (streamIdx < answerSegments.length) {
      const t = setTimeout(() => setStreamIdx(i => i + 1), 110 + Math.random() * 90);
      return () => clearTimeout(t);
    }
    setPhase("done");
  }, [phase, streamIdx]);

  const sources = [
    { id: 1, type: "meeting", who: "ari, meera, jo",  src: "migration kickoff · feb 12", excerpt: "...let's lock in OAuth 2.1 with PKCE as the primary auth path. Passkeys can come later as an additive flow.", hue: "teal" },
    { id: 2, type: "slack",   who: "meera",           src: "#eng · feb 12 09:44",         excerpt: "I love passkeys in theory but the vendor libraries aren't ready. We'd be the canary.", hue: "amber" },
    { id: 3, type: "decision",who: "ari",             src: "decision node · feb 13",      excerpt: "Decision: OAuth 2.1 as primary, passkeys as additive once dependent libs reach 1.0.", hue: "coral" },
    { id: 4, type: "slack",   who: "jo",              src: "#eng · 2 days ago",           excerpt: "fyi: webauthn-kit dropped device-bound keys in their latest roadmap. might want to revisit.", hue: "amber" },
    { id: 5, type: "slack",   who: "ari, jo",         src: "#eng · last week",            excerpt: "...so should we just commit to passwordless? feels like the moment...", hue: "amber" },
  ];

  const renderAnswer = () => {
    const visible = answerSegments.slice(0, streamIdx);
    return visible.map((seg, i) => {
      if (seg.t === "\n\n") return <div key={i} style={{ height: "0.6em" }}/>;
      if (seg.c === null) return <span key={i} className="stream-line">{seg.t}</span>;
      return (
        <span key={i} className="stream-line">
          <span style={{
            background: seg.hl ? "color-mix(in srgb, var(--brand-3) 30%, transparent)" : "transparent",
            padding: seg.hl ? "0 2px" : 0,
            borderRadius: 3,
          }}>{seg.t}</span>
          <span
            className={`cite${hotCite === seg.c ? " hot" : ""}`}
            onMouseEnter={() => setHotCite(seg.c)}
            onMouseLeave={() => setHotCite(null)}
          >{seg.c}</span>
        </span>
      );
    });
  };

  return (
    <div className="screen">
      <div className="container">
        <div className="chrome">
          {/* Top */}
          <div className="chrome-top">
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <Wordmark size={18}/>
              <span style={{ color: "var(--ink-3)" }}>/</span>
              <span className="mono" style={{ fontSize: 13 }}>asking · personal + team scope</span>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <Btn variant="ghost" size="sm" onClick={() => onAdvance("home")}>← back to reef</Btn>
              <Avatar name="Alex" size={28} hue="coral"/>
            </div>
          </div>

          {/* Query bar */}
          <div style={{
            padding: "var(--s-5) var(--s-6)",
            borderBottom: "1px solid var(--line)",
            background: "var(--bg)",
          }}>
            <div className="label" style={{ marginBottom: 8 }}>ask the reef</div>
            <div style={{
              display: "flex", alignItems: "center", gap: 12,
              padding: "14px 18px",
              border: "1px solid var(--brand)",
              borderRadius: "var(--r-3)",
              background: "var(--bg)",
              boxShadow: "0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent)",
            }}>
              <span style={{ color: "var(--brand)", flexShrink: 0 }}>{Icon.search(18)}</span>
              <span style={{
                fontFamily: "var(--display)", fontSize: 22, fontStyle: "italic",
                color: "var(--ink)", lineHeight: 1.2, flex: 1,
              }} className={phase === "typing" ? "cursor" : ""}>
                {query}
              </span>
              <div style={{ display: "flex", gap: 6 }}>
                <Chip hue="coral">personal</Chip>
                <Chip hue="teal">team</Chip>
              </div>
            </div>
          </div>

          {/* Body — two pane: answer + sources */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 360px", minHeight: 540 }}>
            {/* Answer */}
            <div style={{ padding: "var(--s-6)", display: "flex", flexDirection: "column", gap: "var(--s-4)" }}>
              <div className="label">synthesized answer</div>

              {phase === "retrieving" && (
                <div style={{ display: "flex", alignItems: "center", gap: 12, color: "var(--ink-3)" }}>
                  <div className="pulse" style={{ width: 18, height: 18 }}>
                    <DotMandala size={18} density={0.5}/>
                  </div>
                  <span className="mono" style={{ fontSize: 13 }}>
                    retrieving from <span style={{ color: "var(--ink)" }}>47 atoms</span> across personal + team reef…
                  </span>
                </div>
              )}

              {(phase === "streaming" || phase === "done") && (
                <div style={{
                  fontFamily: "var(--sans)", fontSize: 16, lineHeight: 1.7,
                  color: "var(--ink)", maxWidth: "62ch",
                }}>
                  {renderAnswer()}
                  {phase === "streaming" && <span className="cursor" style={{ color: "var(--brand)" }}/>}
                </div>
              )}

              {phase === "done" && (
                <div style={{
                  marginTop: "var(--s-5)", paddingTop: "var(--s-4)",
                  borderTop: "1px solid var(--line)",
                  display: "flex", gap: 10, alignItems: "center",
                }}>
                  <Btn variant="secondary" size="sm" onClick={() => onAdvance("node")}>
                    Open the decision node {Icon.arrowR(12)}
                  </Btn>
                  <Btn variant="ghost" size="sm">Save query as a brief</Btn>
                  <span style={{ flex: 1 }}/>
                  <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>
                    5 sources · sonnet · 2.3s
                  </span>
                </div>
              )}
            </div>

            {/* Sources */}
            <div style={{
              borderLeft: "1px solid var(--line)",
              padding: "var(--s-5)",
              background: "var(--bg-2)",
              overflow: "auto",
            }}>

              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {sources.map(s => (
                  <div
                    key={s.id}
                    className={`source-row${hotCite === s.id ? " hot" : ""}`}
                    onMouseEnter={() => setHotCite(s.id)}
                    onMouseLeave={() => setHotCite(null)}
                    style={{
                      padding: 12, borderRadius: 10,

                      borderLeft: `3px solid var(--hue-${s.hue})`,

          </div>
        </div>
      </div>
    </div>

}

/* =========================================================
   APP — screen router
   ========================================================= */
function App() {
  const [screen, setScreen] = useState("onboard");

  return (
    <>
      {screen === "onboard" && <OnboardScreen onAdvance={setScreen}/>}
      {screen === "home"    && <HomeScreen    onAdvance={setScreen} scope="personal"/>}
      {screen === "query"   && <QueryScreen   onAdvance={setScreen}/>}
      {screen === "node"    && <NodeScreen    onAdvance={setScreen}/>}
      {screen === "team"    && <HomeScreen    onAdvance={setScreen} scope="team"/>}

      {/* Floating screen picker — the only non-design chrome */}
      <div className="picker">
        {[
          ["onboard", "Connect"],
          ["home",    "Personal reef"],
          ["query",   "Asking"],
          ["node",    "Decision"],
          ["team",    "Team reef"],
        ].map(([id, label], i) => (
          <button
            key={id}
            className={screen === id ? "active" : ""}
            onClick={() => {
              if (id === "query") {
                // re-mount query screen so it re-types the question
                setScreen("home");
                setTimeout(() => setScreen("query"), 30);
              } else {
                setScreen(id);
              }
            }}
          >
            <span className="picker-num">0{i+1}</span>{label}
          </button>
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
