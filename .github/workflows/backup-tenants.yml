name: Tenant backup

# Nightly logical backup of EVERY per-org TENANT database (the Neon projects
# holding all customer content), encrypted to R2.
#
# WHY: measured 2026-08-24, tenant PITR was SIX HOURS
# (`history_retention_seconds = 21600`, the free-plan cap then). The org is now
# on the paid `launch` plan and retention was raised to 7 days (604800 s) on
# all three Neon projects on 2026-10-21 (COR-92). PITR still lives inside the
# project it protects —
# so it does not survive project deletion, credential compromise, or a
# provider incident. Three docs asserted tenant DBs were covered by it. See
# scripts/backup_tenants.sh's header and issue #689.
#
# HOW IT DIFFERS FROM backup-control-plane.yml:
#   - Tenants are ENUMERATED from the control plane's `tenant_databases`
#     routing table, so an org onboarded tomorrow is backed up tomorrow night
#     with no change to this file or to any secret.
#   - Tenant DSNs are Fly secrets (TENANT_DB_<SLUG>) and cannot be read by
#     Actions directly. They are resolved through the RUNNING BACKEND, which
#     already holds them as env vars, via `flyctl ssh console`. This needs no
#     new credential — FLY_API_TOKEN is already a repo secret used by
#     deploy.yml and the control-plane backup.
#   - Only the control-plane connection needs the flyctl proxy tunnel
#     (coralswarm-db is 6PN-only). Tenant Neon projects have public endpoints,
#     so the per-tenant dumps connect directly.
#   - The resolved TENANT_DB_<SLUG> secret is the app's POOLED DSN. The script
#     rewrites it to Neon's DIRECT endpoint before pg_dump and refuses a pooler
#     host (COR-92): pg_dump's empty search_path must never land on a
#     PgBouncer connection the app reuses (the COR-82 outage class).
#
# SECRETS REUSED, NOT ADDED: this job introduces no new secret. It uses the
# same BACKUP_* set as the control-plane job, plus FLY_API_TOKEN.

on:
  schedule:
    # 10:00 UTC — one hour after the control-plane backup (09:00) so the two
    # never contend for the same flyctl proxy / machine, and so a failure of
    # one is unambiguous in the run list.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: dump + verify + encrypt per tenant, skip upload/pruning"
        type: boolean
        default: false
      only_slug:
        description: "Back up only this tenant slug (blank = all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tenant-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup tenant databases
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Hard-fail on missing config BEFORE touching anything. A silently
      # skipped nightly backup is the failure this job exists to prevent, so
      # this is `exit 1` with ::error:: annotations, never an `if:` that would
      # report the job as skipped/neutral.
      - name: Verify required secrets are configured
        env:
          HAVE_FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
          HAVE_BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL != '' }}
          HAVE_BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY != '' }}
          HAVE_BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT != '' }}
          HAVE_BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET != '' }}
          HAVE_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID != '' }}
          HAVE_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY != '' }}
        run: |
          missing=0
          check() {
            if [ "$1" != "true" ]; then
              echo "::error::Required repository secret $2 is not set. See docs/runbooks/control-plane-restore.md's 'Activating this workflow' section — the tenant job reuses the same BACKUP_* secrets." >&2
              missing=1
            fi
          }
          check "$HAVE_FLY_API_TOKEN" FLY_API_TOKEN
          check "$HAVE_BACKUP_DATABASE_URL" BACKUP_DATABASE_URL
          check "$HAVE_BACKUP_ENCRYPTION_KEY" BACKUP_ENCRYPTION_KEY
          check "$HAVE_BACKUP_S3_ENDPOINT" BACKUP_S3_ENDPOINT
          check "$HAVE_BACKUP_S3_BUCKET" BACKUP_S3_BUCKET
          check "$HAVE_BACKUP_S3_ACCESS_KEY_ID" BACKUP_S3_ACCESS_KEY_ID
          check "$HAVE_BACKUP_S3_SECRET_ACCESS_KEY" BACKUP_S3_SECRET_ACCESS_KEY
          if [ "$missing" -eq 1 ]; then
            echo "::error::Aborting: one or more required secrets are missing. This is a hard failure, not a skip — no tenant backup ran." >&2
            exit 1
          fi

      # Client version must be >= server, and TENANT servers are the newest
      # thing this repo talks to. Neon runs the production `coralswarm` tenant
      # on PG 18.6, so the v17 client that used to be installed here refused it
      # with `server version mismatch` every night from Aug 25 while `testorg`
      # (still PG17) kept dumping — a half-green job nobody was paged for
      # (issue #745). Install the 18 client: a NEWER client dumps OLDER servers
      # fine, so this one package covers PG17 and PG18 tenants alike, and the
      # script's own client>=server assertion will name the skew explicitly if
      # Neon ever moves past it. The runner's default apt package is v16, hence
      # the PGDG repo (same as backup-control-plane.yml).
      #
      # backup-control-plane.yml deliberately stays on 17: that server is Fly
      # Postgres 17, verified 2026-09-05 (image tag `pgvector-17-2-v1`,
      # `postgres --version` -> 17.7, `/data/postgresql/PG_VERSION` -> 17), so
      # its client is already >= its server and bumping it would be churn.
      #
      # FOR A FUTURE RESTORER: artifacts from this job are now written by
      # pg_dump 18, so reading one back needs pg_restore >= 18. Control-plane
      # artifacts are unaffected (still v17), which is what
      # docs/runbooks/control-plane-restore.md's commands assume.
      - name: Install postgresql-client-18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      # Pinned to a commit SHA, not @master — this job runs with
      # FLY_API_TOKEN and that action tracks a mutable branch.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (pinned 2026-07-19)

      # coralswarm-db (control plane) is 6PN-only and is needed to ENUMERATE
      # tenants. The tenant databases themselves are reached directly.
      - name: Open flyctl proxy to coralswarm-db
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl proxy 15432:5432 -a coralswarm-db > proxy.log 2>&1 &
          echo $! > proxy.pid
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/15432) 2>/dev/null; then
              exec 3>&-
              echo "proxy is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::flyctl proxy to coralswarm-db did not come up within 30s" >&2
          cat proxy.log >&2 || true
          exit 1

      # The resolver the script shells out to per tenant. It receives the
      # secret NAME as $1 and prints the DSN on stdout. That DSN is the app's
      # pooled one; backup_tenants.sh rewrites it to the direct endpoint.
      #
      # `printenv <NAME>` on the running backend, which holds every tenant
      # concierge tenant secret as an env var (the first link of the chain
      # the one-shot operator binaries use). Output is captured by the caller into a
      # variable and passed to the child as an env var — never logged, never
      # written to disk. `-q` keeps flyctl's own chatter off stdout so only
      # the DSN is returned.
      #
      # A self-serve tenant's DSN is not an env var: it lives KEK-encrypted in
      # the control table `tenant_db_credentials` (control 0381). When
      # `printenv` finds nothing, `migrate_tenants --resolve-dsn` resolves the
      # ref through the same env-then-table chain the server uses and prints
      # only the DSN (its stderr is discarded on the machine, so an error can
      # never be mistaken for a DSN). Only `TENANT_DB_*` names are resolved,
      # never another app secret. `backup_tenants.sh` registers every resolved
      # DSN with `::add-mask::` before using it, so it cannot reach this log
      # even if a later step echoes it.
      - name: Write tenant DSN resolver
        run: |
          cat > resolve_tenant_dsn.sh <<'RESOLVER'
          #!/usr/bin/env bash
          set -euo pipefail
          name="$1"
          case "$name" in
            *[!A-Z0-9_]*|'') echo "bad secret name" >&2; exit 2 ;;
          esac
          case "$name" in
            TENANT_DB_?*) ;;
            *) echo "not a tenant secret name" >&2; exit 2 ;;
          esac
          flyctl ssh console -a coralswarm-backend -q \
            -C "/bin/sh -c 'printenv $name || /app/migrate_tenants --resolve-dsn $name 2>/dev/null'" 2>/dev/null | tr -d '\r'
          RESOLVER
          chmod +x resolve_tenant_dsn.sh

      - name: Run tenant backups
        env:
          # Ubuntu's /usr/bin/pg_dump is a pg_wrapper that can resolve to the
          # preinstalled v16 client even with 18 installed, so point the
          # script's override at 18's real bindir — the path the pgdg
          # postgresql-client-18 package actually installs into.
          PG_BIN_DIR: /usr/lib/postgresql/18/bin
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL_RAW: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_DSN_RESOLVER_CMD: ./resolve_tenant_dsn.sh
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          ONLY_SLUG_INPUT: ${{ inputs.only_slug }}
        run: |
          # Rewrite the control-plane DSN's host:port to the local tunnel. The
          # secret holds the real Fly-internal host — never printed, only
          # substituted. Tenants are enumerated through this connection.
          DATABASE_URL="$(printf '%s' "$DATABASE_URL_RAW" | sed -E 's#@[^@/]+(:[0-9]+)?/#@127.0.0.1:15432/#')"
          export DATABASE_URL
          if [ -n "${ONLY_SLUG_INPUT:-}" ]; then
            export BACKUP_ONLY_SLUG="$ONLY_SLUG_INPUT"
          fi
          args=()
          if [ "${DRY_RUN_INPUT:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          bash scripts/backup_tenants.sh "${args[@]}"

      - name: Close flyctl proxy
        if: always()
        run: |
          if [ -f proxy.pid ]; then
            kill "$(cat proxy.pid)" 2>/dev/null || true
          fi
