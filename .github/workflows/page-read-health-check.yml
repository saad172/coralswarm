name: Page read health check

# Private internal:8081, one Fly machine's in-memory 60-minute ledger.
# This is not fleet aggregation. GitHub's scheduled-failure notifications
# are the alert channel. Do not ping the chain-health watchdog from here.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-read-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify required existing credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          for name in ('FLY_API_TOKEN', 'INTERNAL_TOKEN'):
              value = os.environ.get(name, '')
              if not value.strip() or value != value.strip() or any(ord(c) < 32 or ord(c) == 127 for c in value):
                  raise SystemExit(f'::error::Missing or malformed {name}; no health check ran')
          PY
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # same pin as chain-health
      - name: Poll and judge the private page-read ledger
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p page-read-health
          flyctl proxy 18081:8081 -a coralswarm-backend > page-read-health/proxy.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true; wait "$proxy_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 30); do
            kill -0 "$proxy_pid" 2>/dev/null || { echo '::error::Fly proxy exited'; exit 1; }
            if (exec 3<>/dev/tcp/127.0.0.1/18081) 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ] || { echo '::error::Fly proxy failed to start within 30s'; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 15 \
            -H "X-Internal-Token: ${INTERNAL_TOKEN}" \
            http://127.0.0.1:18081/internal/admin/page-read-health \
            -o page-read-health/response.json
          if python3 scripts/check_page_read_health.py page-read-health/response.json > page-read-health/verdict.json; then
            cat page-read-health/verdict.json
          else
            status=$?
            cat page-read-health/verdict.json
            exit "$status"
          fi
      - name: Retain raw evidence and verdict, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: page-read-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: page-read-health/
          retention-days: 14
          if-no-files-found: warn
