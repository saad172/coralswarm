name: Database health check

# Hourly read-only poll of the Fly Postgres apps' own health checks and
# machine events. On 2026-10-29 the kernel OOM-killed Postgres on
# coralswarm-db-staging (512 MB RAM) and it stayed down about 14 hours; nobody
# noticed until a release's staging deploy failed. This run goes red when
# either database's machine is not started, a Fly check (`pg`, `role`, `vm`)
# is not passing, or a machine event in the last 24 hours reports
# `oom_killed`. A red scheduled run emails the founder, the same alerting path
# as chain-health-check.yml and ask-reliability.yml. See
# scripts/check_fly_db_health.py and docs/runbooks/release.md.
#
# It does not ping HEALTHCHECK_PING_URL: that watchdog proves
# chain-health-check.yml is still running, and a second pinger would hide its
# silence.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-health-check
  cancel-in-progress: false

jobs:
  check:
    name: Check coralswarm-db and coralswarm-db-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required secrets are configured
        env:
          HAVE_FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
        run: |
          if [ "$HAVE_FLY_API_TOKEN" != "true" ]; then
            echo "::error::Required repository secret FLY_API_TOKEN is not set; no database health check ran." >&2
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (pinned 2026-07-19)

      - name: Check Postgres health and OOM kills
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python3 scripts/check_fly_db_health.py coralswarm-db coralswarm-db-staging
